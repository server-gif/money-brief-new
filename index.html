<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b45309" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://securepubads.g.doubleclick.net" crossorigin />
    <!-- Fonts use the native system stack (iOS SF Pro on Apple devices) — no webfont download. -->
    <!-- Title, description, canonical and Open Graph tags are rendered per page by <SEO />. -->
    <script>
      /* Apply saved theme before first paint so there is no light flash on load. */
      (function () {
        try {
          if (localStorage.getItem('ff-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) { /* storage unavailable — stay light */ }
      })();
    </script>
    <style>
      /* Instant splash shown while the app bundle loads; faded out by main.jsx. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(160deg, rgba(180, 83, 9, 0.03) 0%, transparent 40%), #faf6ef;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-splash__mark {
        width: 68px;
        height: 68px;
        display: block;
        filter: drop-shadow(0 10px 22px rgba(180, 83, 9, 0.28));
        animation: app-splash-in 0.5s ease both, app-splash-float 2.6s 0.6s ease-in-out infinite;
      }
      .app-splash__name {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #201a15;
        animation: app-splash-in 0.5s 0.12s ease both;
      }
      .app-splash__name span {
        color: #b45309;
      }
      /* Three brand dots replace the old progress bar. */
      .app-splash__dots {
        display: inline-flex;
        gap: 8px;
        animation: app-splash-in 0.5s 0.24s ease both;
      }
      .app-splash__dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        animation: app-splash-bounce 1s ease-in-out infinite;
      }
      .app-splash__dots i:nth-child(1) { background: #b45309; }
      .app-splash__dots i:nth-child(2) { background: #065f46; animation-delay: 0.16s; }
      .app-splash__dots i:nth-child(3) { background: #201a15; animation-delay: 0.32s; }
      @keyframes app-splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes app-splash-bounce {
        0%, 100% { transform: translateY(0); opacity: 0.55; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
      @keyframes app-splash-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash { transition-duration: 0.01ms; }
        .app-splash__mark,
        .app-splash__name,
        .app-splash__dots,
        .app-splash__dots i { animation: none; opacity: 1; }
      }
      /* Splash follows the saved dark theme too. */
      html[data-theme='dark'] #app-splash {
        background: #181310;
      }
      html[data-theme='dark'] .app-splash__name {
        color: #faf6ef;
      }
      html[data-theme='dark'] .app-splash__name span {
        color: #f59e0b;
      }
      html[data-theme='dark'] .app-splash__dots i:nth-child(1) { background: #f59e0b; }
      html[data-theme='dark'] .app-splash__dots i:nth-child(2) { background: #34d399; }
      html[data-theme='dark'] .app-splash__dots i:nth-child(3) { background: #faf6ef; }
    </style>
  </head>
